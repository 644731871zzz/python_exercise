{% extends "blogs/base.html" %}

{% load django_bootstrap5 %}

{% block page_header %}
    <h2><a href="{% url 'blogs:topic' topic.id %}">{{ topic }}
    </a></h2>
{% endblock page_header %}

{% block content %}

    <h3>Add a new entry:</h3>
    <form action="{% url 'blogs:new_entry' topic.id %}"method='post'>
        {% csrf_token %}
        {% bootstrap_form form %}
        {% bootstrap_button button_type="submit" content="Add entry" %}
    
    </form>

{% endblock content %}
