{% extends "blogs/base.html" %}

{% load django_bootstrap5 %}

{% block page_header %}
    <h2><a href="{% url 'blogs:topic' topic.id %}">{{ topic }}</a></h2>
{% endblock page_header %}

{% block content %}

    <h3>Edit entry:</h3>

    <form action="{% url 'blogs:edit_entry' entry.id %}" method = 'post'>
        {% csrf_token %}
        {% bootstrap_form form %}
        {% bootstrap_button button_type="submit" content="Save changes" %}
 
    </form>

    {% endblock content %}
